<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度聯合查榜系統</title>
    <style>
        :root { --primary: #0284c7; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; line-height: 1.5; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* 標題與搜尋 */
        header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        .search-card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 6px solid var(--primary); }
        .search-group { display: flex; gap: 8px; }
        input { flex: 1; border: 2px solid #e2e8f0; padding: 15px; border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: #fff; }
        button { background: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #0369a1; }
        
        .status { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 12px; }

        /* 結果顯示 */
        .student-header { background: linear-gradient(135deg, #0284c7, #075985); color: white; padding: 25px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3); }
        .student-header h2 { margin: 0; font-size: 28px; letter-spacing: 2px; }
        .info-row { display: flex; gap: 20px; margin-top: 10px; font-size: 14px; opacity: 0.9; }
        .site-badge { margin-top: 12px; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 10px; font-size: 15px; display: inline-block; }
        .site-name { font-weight: bold; color: #fef08a; }

        /* 校系卡片 */
        .school-card { background: white; padding: 18px; border-radius: 15px; margin-bottom: 12px; border-left: 6px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .school-card:hover { transform: translateX(5px); border-left-color: var(--primary); background: #f0f9ff; }
        .type-tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
        .tag-cac { background: #e0f2fe; color: #0369a1; }
        .tag-jctv { background: #dcfce7; color: #166534; }

        /* Modal 彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); z-index: 999; }
        .modal-content { background: white; width: 90%; max-width: 450px; margin: 10vh auto; border-radius: 24px; display: flex; flex-direction: column; height: 70vh; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { padding: 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
        .modal-body { padding: 10px; overflow-y: auto; }
        .list-item { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #f8fafc; cursor: pointer; }
        .list-item:hover { background: #f1f5f9; border-radius: 10px; }

        .loading-text { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎓 115學年度聯合查榜系統</h1>
        <p>整合 考場、考生姓名、普大/科大數據</p>
    </header>

    <div class="search-card">
        <div id="dataStatus" class="status">正在同步 GitHub 數據庫...</div>
        <div class="search-group">
            <input type="text" id="userInput" placeholder="輸入姓名 (如: 葉學群) 或 8 位號碼..." disabled>
            <button id="searchBtn" onclick="handleSearch()" disabled>查詢</button>
        </div>
    </div>

    <div id="resultArea"></div>
</div>

<!-- 校系清單 Modal -->
<div id="deptModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div>
                <h3 id="modalTitle" style="margin:0">系組名單</h3>
                <small id="modalSubTitle" style="color:#64748b"></small>
            </div>
            <button onclick="closeModal()" style="background:none; color:#94a3b8; font-size:24px; padding:0">✕</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

        [14250101, 14250104, "新北市立海山高中"], [11073601, 11078536, "新北市立板橋高中"], [19250501, 19251205, "新北市立板橋高中"],
        [11078601, 11083536, "新北市立新莊高中"], [19251301, 19251507, "新北市立新莊高中"], [11083601, 11089332, "新北市立丹鳳高中"],
        [14250201, 14250201, "新北市立丹鳳高中"], [19251601, 19251902, "新北市立丹鳳高中"], [11089401, 11093915, "新北市立新北高中"],

        [14310101, 14310103, "桃園市立武陵高中"], [11118901, 11123336, "桃園市立陽明高中"], [11123401, 11128236, "桃園市立桃園高中"],
        [11128301, 11131426, "國立北科大附屬桃園農工"], [19310101, 19311001, "國立北科大附屬桃園農工"], [11131501, 11135236, "國立中央大學附屬中壢高中"],

        [19430301, 19430305, "私立弘文高中"], [11207701, 11212136, "臺中市立臺中女中"], [11212201, 11216326, "臺中市立惠文高中"],

        [11246301, 11250436, "國立嘉義女中"], [19540101, 19540502, "國立嘉義女中"], [11250501, 11253935, "國立臺南一中"],
        [14610101, 14610102, "國立臺南一中"], [19610101, 19610701, "國立臺南一中"], [11254001, 11259036, "國立臺南二中"],
        [11259101, 11263136, "國立臺南女中"], [11263201, 11267736, "國立家齊高中"], [11267801, 11272936, "私立長榮高中"],
        [11273001, 11276208, "國立新營高中"], [19640101, 19640203, "國立新營高中"], [11276301, 11279019, "國立高雄師範大學"],
        [14710101, 14710103, "國立高雄師範大學"], [19710101, 19711008, "國立高雄師範大學"], [11279101, 11281036, "國立高雄師大附中"],
        [11281101, 11284536, "高雄市立中正高中"], [11284601, 11289236, "國立鳳新高中"], [11289301, 11294636, "私立道明高中"],
        [11294701, 11299236, "高雄市立高雄高中"], [11299301, 11303736, "高雄市立高雄女中"], [11303801, 11307631, "高雄市立中山高中"],
        [11307701, 11312236, "高雄市立左營高中"], [11312301, 11314734, "國立屏東大學"], [19770101, 19770201, "國立屏東大學"],
        [11314801, 11316436, "國立屏東大學(屏師校區)"], [11316501, 11319836, "國立屏東女中"], [11319901, 11326235, "國立宜蘭大學"],
        [11326301, 11328436, "國立花蓮高中"], [11328501, 11330514, "國立花蓮女中"], [11330601, 11332810, "國立臺東女中"],
        [11332901, 11333523, "國立澎湖科技大學"], [11333601, 11334531, "國立金門大學"], [11334601, 11334708, "國立馬祖高中"]
    ];

    let rawData = null;
    let idToIndex = {};    // 號碼 -> [{type, school, dept}]
    let nameToIndex = {};  // 姓名 -> [號碼]
    let deptToIndex = {};  // 校系Key -> [號碼]

    window.onload = async () => {
        try {
            const response = await fetch(GITHUB_URL);
            rawData = await response.json();
            buildIndex();
        } catch (e) {
            document.getElementById('dataStatus').innerText = "❌ 資料載入失敗。";
        }
    };

    function buildIndex() {
        const types = { cac: "普通大學", jctv: "科技校院" };
        for (let type in types) {
            const schools = rawData[type];
            for (let sName in schools) {
                for (let dName in schools[sName]) {
                    const ids = schools[sName][dName];
                    const dKey = `${types[type]}-${sName}-${dName}`;
                    deptToIndex[dKey] = ids;
                    ids.forEach(id => {
                        if (!idToIndex[id]) idToIndex[id] = [];
                        idToIndex[id].push({ type: types[type], school: sName, dept: dName });
                    });
                }
            }
        }
        for (let id in rawData.name_map) {
            const name = rawData.name_map[id];
            if (!nameToIndex[name]) nameToIndex[name] = [];
            nameToIndex[name].push(id);
        }
        document.getElementById('dataStatus').innerText = "✅ 系統就緒，請輸入號碼或姓名";
        document.getElementById('userInput').disabled = false;
        document.getElementById('searchBtn').disabled = false;
    }

    function getSite(id) {
        const val = parseInt(id);
        const match = TEST_SITES.find(s => val >= s[0] && val <= s[1]);
        return match ? match[2] : "未知考場";
    }

    function maskName(name) {
        if (!name || name.length < 2 || name.includes('Ｏ')) return name;
        return name[0] + 'Ｏ' + (name.length > 2 ? name[name.length - 1] : '');
    }

    function handleSearch() {
        const query = document.getElementById('userInput').value.trim();
        if (!query) return;

        let ids = [];
        if (/^\d{8}$/.test(query)) {
            ids = [query];
        } else {
            const masked = maskName(query);
            ids = nameToIndex[masked] || [];
        }

        render(ids);
    }

    function render(ids) {
        const container = document.getElementById('resultArea');
        container.innerHTML = "";
        if (ids.length === 0) {
            alert("查無記錄！");
            return;
        }

        ids.forEach(id => {
            const name = rawData.name_map[id] || "（無姓名紀錄）";
            const site = getSite(id);
            const depts = idToIndex[id] || [];

            let html = `
                <div class="student-header">
                    <h2>${name}</h2>
                    <div class="info-row">
                        <span>應試號碼：${id}</span>
                    </div>
                    <div class="site-badge">考場：<span class="site-name">${site}</span></div>
                </div>
            `;

            depts.forEach(item => {
                const dKey = `${item.type}-${item.school}-${item.dept}`;
                const tagClass = item.type === "普通大學" ? "tag-cac" : "tag-jctv";
                html += `
                    <div class="school-card" onclick="openModal('${dKey}')">
                        <div>
                            <span class="type-tag ${tagClass}">${item.type}</span>
                            <div style="font-weight:bold; font-size:18px;">${item.school}</div>
                            <div style="font-size:14px; color:#64748b;">${item.dept}</div>
                        </div>
                        <span style="color:#cbd5e1">❯</span>
                    </div>
                `;
            });
            container.innerHTML += html;
        });
    }

    function openModal(dKey) {
        const ids = deptToIndex[dKey];
        const [type, school, dept] = dKey.split('-');
        document.getElementById('modalTitle').innerText = dept;
        document.getElementById('modalSubTitle').innerText = school;
        
        const body = document.getElementById('modalBody');
        body.innerHTML = "";
        ids.forEach(id => {
            const name = rawData.name_map[id] || "（無名）";
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${name}</span><span style="color:#94a3b8; font-family:monospace">${id}</span>`;
            div.onclick = () => { closeModal(); render([id]); window.scrollTo(0,0); };
            body.appendChild(div);
        });
        document.getElementById('deptModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('deptModal').style.display = 'none'; }
</script>
</body>
</html>
