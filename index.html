<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>象棋 AI - ffish-es6 版</title>
<style>
    body { font-family: sans-serif; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    #status { padding: 10px; background: #444; border-radius: 8px; margin-bottom: 15px; color: #0f0; min-width: 320px; text-align: center; border: 1px solid #666; }
    #board { position: relative; width: 360px; height: 400px; background: #e6b87c; border: 5px solid #8b5a2b; cursor: pointer; }
    .line-h { position: absolute; background: #8b5a2b; height: 1px; left: 20px; width: 320px; z-index: 0; }
    .line-v { position: absolute; background: #8b5a2b; width: 1px; top: 20px; height: 360px; z-index: 0; }
    .piece { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: #fdf5e6; border: 2px solid #8b5a2b; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; z-index: 10; transform: translate(-50%, -50%); transition: all 0.15s; }
    .red { color: #c00; border-color: #c00; } .black { color: #000; border-color: #000; }
    .selected { background: #ffeb3b; z-index: 20; box-shadow: 0 0 15px #ff0; }
    .dot { position: absolute; width: 12px; height: 12px; background: rgba(0,200,0,0.6); border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
</style>
</head>
<body>

<h2 style="color:#f0c040">Pikafish AI (ffish-es6 修正版)</h2>
<div id="status">正在初始化引擎模組...</div>
<div id="board"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script type="module">
    // 1. 修正導入方式：使用預設導出 (Default Import)
    import initFfish from 'https://esm.sh/ffish-es6';

    const MARGIN = 20, GAP = 40;
    const PN = { 'k':'將', 'a':'士', 'b':'象', 'n':'馬', 'r':'車', 'c':'包', 'p':'卒', 'K':'帥', 'A':'仕', 'B':'相', 'N':'傌', 'R':'俥', 'C':'炮', 'P':'兵' };
    
    let ffish = null;   // 套件實例
    let board = null;   // 棋盤物件
    let selectedSq = null;
    let isAiThinking = false;

    async function start() {
        try {
            // 2. 執行工廠函數初始化模組
            $('#status').text('正在載入 WebAssembly...');
            ffish = await initFfish();
            
            // 3. 建立象棋棋盤 (ffish 語法類似 python-chess)
            board = new ffish.Board("xiangqi");
            
            drawGrid();
            render();
            $('#status').text('準備就緒！請執紅先行');

            // 4. 處理 AI 邏輯
            // 注意：ffish-es6 主要提供棋規，若要「自動下棋」，我們需要呼叫它的內建搜索
            // 或者模擬一個簡單的搜索邏輯。
        } catch (e) {
            console.error(e);
            $('#status').text('載入失敗: ' + e.message);
        }
    }

    function render() {
        $('#board .piece, #board .dot').remove();
        
        // 使用 board.fen() 取得當前局面並繪製
        const fen = board.fen().split(' ')[0];
        const rows = fen.split('/');
        
        rows.forEach((row, r) => {
            let c = 0;
            for (let i = 0; i < row.length; i++) {
                const char = row[i];
                if (!isNaN(char)) c += parseInt(char);
                else {
                    const isRed = char === char.toUpperCase();
                    const sq = String.fromCharCode(97 + c) + (9 - r);
                    const $p = $('<div class="piece"></div>')
                        .addClass(isRed ? 'red' : 'black')
                        .text(PN[char])
                        .css({ left: MARGIN + c * GAP, top: MARGIN + r * GAP })
                        .attr('data-sq', sq);
                    
                    if (selectedSq === sq) $p.addClass('selected');
                    $('#board').append($p);
                    c++;
                }
            }
        });

        // 畫合法步提示
        if (selectedSq) {
            // ffish 的合法步取得方式
            const moves = board.legalMoves(selectedSq);
            moves.split(' ').forEach(m => {
                if(!m) return;
                const to = m.substring(2, 4); // 取得目標格，如 "e4e5" 中的 "e5"
                const col = to.charCodeAt(0) - 97;
                const row = 9 - parseInt(to[1]);
                $('#board').append($('<div class="dot"></div>').css({ left: MARGIN + col * GAP, top: MARGIN + row * GAP }));
            });
        }
    }

    // 處理點擊移動
    $('#board').on('click', function(e) {
        if (isAiThinking || board.isGameOver()) return;

        const offset = $(this).offset();
        const x = Math.round((e.pageX - offset.left - MARGIN) / GAP);
        const y = Math.round((e.pageY - offset.top - MARGIN) / GAP);
        if (x < 0 || x > 8 || y < 0 || y > 9) return;
        
        const sq = String.fromCharCode(97 + x) + (9 - y);
        const piece = board.pieceAt(sq);

        if (piece && piece.includes('white')) { // ffish 內部紅方通常標註為 white
            selectedSq = sq;
        } else if (selectedSq) {
            // 嘗試移動 (例如 "e3e4")
            const moveStr = selectedSq + sq;
            try {
                board.push(moveStr); // 執行移動
                selectedSq = null;
                render();
                if (!board.isGameOver()) {
                    setTimeout(aiMove, 200);
                }
            } catch(err) {
                selectedSq = null;
            }
        }
        render();
    });

    // 簡易 AI：呼叫引擎搜尋 (ffish 內建了 Fairy-Stockfish 的搜索功能)
    function aiMove() {
        isAiThinking = true;
        $('#status').text('Pikafish 思考中...');
        
        setTimeout(() => {
            // ffish 提供最佳步搜索，這裡設定搜尋深度或時間
            // 注意：不同 build 具體方法名可能有異，這裡使用通用 API
            const bestMove = board.bestMove(1000); // 搜尋 1000 毫秒
            board.push(bestMove);
            render();
            $('#status').text(board.isCheck() ? '被將軍！輪到你了' : '輪到你了');
            isAiThinking = false;
        }, 50);
    }

    function drawGrid() {
        const $b = $('#board');
        for (let i = 0; i < 10; i++) $b.append($('<div class="line-h"></div>').css('top', MARGIN + i * GAP));
        for (let i = 0; i < 9; i++) {
            const h = (i === 0 || i === 8) ? 360 : 160;
            $b.append($('<div class="line-v"></div>').css({ left: MARGIN + i * GAP, height: h }));
            if (i > 0 && i < 8) $b.append($('<div class="line-v"></div>').css({ left: MARGIN + i * GAP, top: 220, height: 160 }));
        }
    }

    start();
</script>
</body>
</html>
