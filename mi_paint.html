<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mi_paint --  小米白板</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <!-- 引入 iro.js 色環庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>

    <script type="module">
        import { getStroke } from 'https://esm.sh/perfect-freehand';
        function getSvgPathFromStroke(stroke) {
            if (!stroke.length) return "";
            const d = stroke.reduce(
                (acc, [x0, y0], i, arr) => {
                    const [x1, y1] = arr[(i + 1) % arr.length];
                    acc.push(x0, y0, (x0 + x1) / 2, (y0 + y1) / 2);
                    return acc;
                },
                ["M", ...stroke[0], "Q"]
            );
            d.push("Z");
            return d.join(" ");
        }
        window.getStroke = getStroke;
        window.getSvgPathFromStroke = getSvgPathFromStroke;
    </script>

    <style>
        body { margin: 0; background-color: #F8FAFC; overflow: hidden; touch-action: none; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }
        
        /* --- UI 容器 --- */
        .ui-top-center {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 100;
            width: 90%; max-width: 650px; pointer-events: none;
        }

        .ui-top-right {
            position: absolute; top: 16px; right: 16px; z-index: 101;
            display: flex; gap: 8px;
        }
        
        /* 面板樣式 */
        .panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05);
            padding: 6px;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
            pointer-events: auto;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* 按鈕樣式 */
        .btn {
            width: 40px; height: 40px; border-radius: 10px; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: transparent; color: #64748B;
            transition: all 0.2s;
        }
        .btn:hover { background: #F1F5F9; color: #334155; }
        .btn.active { background: #EFF6FF; color: #2563EB; box-shadow: inset 0 0 0 1px #BFDBFE; }
        .btn.danger:hover { background: #FEF2F2; color: #EF4444; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .divider { width: 1px; height: 24px; background: #CBD5E1; margin: 0 4px; }

        /* 次級工具列 */
        .sub-tools { 
            font-size: 13px; padding: 8px 16px; min-height: 40px;
            transition: opacity 0.2s, transform 0.2s;
        }
        
        /* 選項與滑桿 */
        .opt-group { display: flex; background: #F1F5F9; border-radius: 8px; padding: 2px; }
        .opt-btn { 
            padding: 4px 12px; border-radius: 6px; cursor: pointer; color: #64748B; 
            transition: 0.2s; font-weight: 500;
        }
        .opt-btn.selected { background: white; color: #0F172A; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .setting-item { display: flex; align-items: center; gap: 8px; margin-left: 12px; color: #64748B; }
        input[type="range"] { width: 80px; accent-color: #2563EB; cursor: pointer; }
        
        /* 顏色按鈕 (觸發色環) */
        .color-trigger {
            width: 28px; height: 28px; border-radius: 50%; 
            border: 2px solid #fff; box-shadow: 0 0 0 1px #CBD5E1; 
            cursor: pointer; transition: transform 0.1s;
        }
        .color-trigger:active { transform: scale(0.9); }

        /* 色環 Popover */
        #color-popover {
            position: absolute; top: 140px; left: 50%; transform: translateX(-50%);
            background: white; padding: 16px; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); z-index: 200;
            display: none; flex-direction: column; align-items: center;
            border: 1px solid rgba(0,0,0,0.05);
        }
        #color-popover.visible { display: flex; animation: fadeIn 0.2s; }

        /* 設定模態框 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 998;
            display: none; justify-content: center; align-items: center; backdrop-filter: blur(2px);
        }
        .modal-content {
            background: white; width: 340px; border-radius: 20px; padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 999;
            font-size: 14px; color: #334155;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; color: #0F172A; display:flex; justify-content:space-between; align-items:center; }
        .modal-row { margin-bottom: 16px; }
        .modal-label { display: block; margin-bottom: 6px; font-weight: 500; }
        .modal-select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #CBD5E1; background: #F8FAFC; color: #334155; }
        
        .toggle-switch { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .toggle-track { width: 44px; height: 24px; background: #E2E8F0; border-radius: 12px; position: relative; transition: 0.2s; }
        .toggle-thumb { width: 20px; height: 20px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        input:checked + .toggle-track { background: #2563EB; }
        input:checked + .toggle-track .toggle-thumb { transform: translateX(20px); }
        hr.modal-divider { border:0; border-top:1px solid #E2E8F0; margin: 16px 0; }

        /* 索套選單 */
        #lasso-actions {
            position: absolute; display: none;
            background: #1E293B; padding: 6px; border-radius: 10px;
            gap: 8px; z-index: 200; transform: translate(-50%, -100%); margin-top: -15px;
        }
        #lasso-actions.visible { display: flex; animation: popIn 0.2s; }
        .action-btn { color: white; background: transparent; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 13px; }
        .action-btn:hover { background: rgba(255,255,255,0.15); }
        @keyframes popIn { from { transform: translate(-50%, -90%) scale(0.9); opacity: 0; } to { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; } }

        #loading { position: fixed; inset:0; background:white; z-index:9999; display:flex; justify-content:center; align-items:center; transition: opacity 0.5s;}
    </style>
</head>
<body>

    <div id="loading">載入引擎中...</div>

    <!-- 色環 Popover (獨立層) -->
    <div id="color-popover">
        <div id="iro-picker-container"></div>
        <div style="font-size:12px; color:#94A3B8; margin-top:8px;">點擊外部關閉</div>
    </div>

    <!-- 設定模態框 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-title">
                <span>設定</span>
                <button class="btn" id="close-settings" style="width:32px;height:32px"><i data-lucide="x"></i></button>
            </div>
            
            <div style="font-weight:bold; color:#64748B; margin-bottom:12px;">觸控與壓力</div>
            <div class="modal-row">
                <label class="toggle-switch">
                    <span>防誤觸 (僅觸控筆)</span>
                    <label>
                        <input type="checkbox" id="palm-check" style="display:none">
                        <div class="toggle-track"><div class="toggle-thumb"></div></div>
                    </label>
                </label>
                <div style="font-size:12px; color:#94A3B8; margin-top:4px;">開啟後，手指無法繪圖。</div>
            </div>

            <div class="modal-row">
                <span class="modal-label">手指/滑鼠 壓力模擬</span>
                <select class="modal-select" id="finger-pressure-mode">
                    <option value="speed">依速度 (快粗慢細)</option>
                    <option value="none">無變化 (固定粗細)</option>
                </select>
            </div>

            <div class="modal-row">
                <span class="modal-label">觸控筆 壓力來源</span>
                <select class="modal-select" id="stylus-pressure-mode">
                    <option value="pressure">真實壓力感應 (推薦)</option>
                    <option value="speed">依速度 (快粗慢細)</option>
                    <option value="none">無變化 (固定粗細)</option>
                </select>
            </div>

            <hr class="modal-divider">

            <div style="font-weight:bold; color:#64748B; margin-bottom:12px;">Redmi靈感觸控筆按鍵</div>

            <div class="modal-row">
                <span class="modal-label">速記鍵(下鍵)</span>
                <select class="modal-select" id="btn-34-action">
                    <option value="none">無功能 (預設)</option>
                    <option value="toggle-eraser">切換橡皮擦/畫筆</option>
                    <option value="toggle-lasso">切換索套/畫筆</option>
                    <option value="undo">復原</option>
                    <option value="redo">重做 (取消復原)</option>
                    <option value="next-tool">下一個工具</option>
                </select>
            </div>

            <div class="modal-row">
                <span class="modal-label">截圖鍵(上鍵)</span>
                <select class="modal-select" id="btn-33-action">
                    <option value="none">無功能 (預設)</option>
                    <option value="toggle-lasso">切換索套/畫筆</option>
                    <option value="toggle-eraser">切換橡皮擦/畫筆</option>
                    <option value="undo">復原</option>
                    <option value="redo">重做 (取消復原)</option>
                    <option value="next-tool">下一個工具</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 右上角設定鈕 -->
    <div class="ui-top-right">
        <div class="panel">
            <button class="btn" id="btn-settings"><i data-lucide="settings"></i></button>
        </div>
    </div>

    <!-- 中央工具列 -->
    <div class="ui-top-center">
        <div class="panel main-tools">
            <button class="btn active" id="tool-pen" title="畫筆"><i data-lucide="pen-tool"></i></button>
            <button class="btn" id="tool-eraser" title="橡皮擦"><i data-lucide="eraser"></i></button>
            <button class="btn" id="tool-eraser-rect" title="方框擦除"><i data-lucide="box-select"></i></button>
            <button class="btn" id="tool-lasso" title="索套"><i data-lucide="lasso"></i></button>
            <div class="divider"></div>
            <button class="btn" id="btn-undo" title="復原 (Ctrl+Z)" disabled><i data-lucide="undo-2"></i></button>
            <button class="btn" id="btn-redo" title="重做 (Ctrl+Y)" disabled><i data-lucide="redo-2"></i></button>
            <button class="btn danger" id="tool-clear" title="清空畫布"><i data-lucide="trash-2"></i></button>
        </div>

        <div class="panel sub-tools" id="sub-toolbar">
            <!-- JS 動態生成 -->
        </div>
    </div>

    <!-- 索套選單 -->
    <div id="lasso-actions">
        <button class="action-btn" id="lasso-dup"><i data-lucide="copy" size="14"></i> 複製</button>
        <div style="width:1px; background:#475569; height:16px;"></div>
        <button class="action-btn text-red-400" id="lasso-del" style="color:#FCA5A5"><i data-lucide="trash" size="14"></i> 刪除</button>
    </div>

    <canvas id="canvas" resize></canvas>

    <script type="module">
        import { getStroke } from 'https://esm.sh/perfect-freehand';
        paper.install(window);

        // --- 設定與狀態 ---
        const Settings = {
            palmRejection: false,
            fingerMode: 'speed',
            stylusMode: 'pressure',
            // 改為預設無功能
            stylusBtn34: 'none', 
            stylusBtn33: 'none'
        };

        const App = {
            mode: 'pen',
            penType: 'fountain',
            strokeColor: '#1E293B',
            strokeWidth: 8,
            strokeOpacity: 1.0,
            eraserMode: 'standard',
            eraserSize: 20,
            
            // 繪圖狀態
            currentPath: null,      
            currentPoints: [],
            lastPointTime: 0,
            
            eraserPreview: null,
            rectStart: null, rectPath: null,
            lassoPath: null, lassoItems: [], lassoState: 'idle', lassoPrevPoint: null,
            
            activePointers: new Map(), 
            isGesturing: false
        };

        // iro.js 實體
        let colorPickerInstance = null;

        const History = {
            stack: [], pointer: -1, maxStates: 30,
            init() { this.saveState(); },
            saveState() {
                if (this.pointer < this.stack.length - 1) this.stack = this.stack.slice(0, this.pointer + 1);
                this.stack.push(project.activeLayer.exportJSON());
                if (this.stack.length > this.maxStates) this.stack.shift(); else this.pointer++;
                this.updateButtons();
            },
            undo() { if (this.pointer > 0) { this.pointer--; this.restoreState(); } },
            redo() { if (this.pointer < this.stack.length - 1) { this.pointer++; this.restoreState(); } },
            restoreState() {
                project.activeLayer.removeChildren(); project.activeLayer.importJSON(this.stack[this.pointer]);
                this.updateButtons(); App.lassoPath = null; App.eraserPreview = null; view.update();
            },
            updateButtons() {
                document.getElementById('btn-undo').disabled = this.pointer <= 0;
                document.getElementById('btn-redo').disabled = this.pointer >= this.stack.length - 1;
            }
        };

        window.onload = function() {
            lucide.createIcons();
            paper.setup('canvas');
            
            // 初始化 iro.js
            initColorPicker();
            
            History.init();
            updateSubToolbar();
            initEvents();
            initSettingsUI();
            
            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => document.getElementById('loading').remove(), 500);
        };

        function initColorPicker() {
            colorPickerInstance = new iro.ColorPicker("#iro-picker-container", {
                width: 200,
                color: App.strokeColor,
                layout: [
                    { component: iro.ui.Wheel, options: { wheelLightness: false } },
                    { component: iro.ui.Slider, options: { sliderType: 'value' } }
                ]
            });
            colorPickerInstance.on('color:change', function(color) {
                App.strokeColor = color.hexString;
                const trigger = document.getElementById('color-trigger-btn');
                if (trigger) trigger.style.background = App.strokeColor;
            });
        }

        function toggleColorPopover() {
            const pop = document.getElementById('color-popover');
            const isVisible = pop.classList.contains('visible');
            
            if (isVisible) {
                pop.classList.remove('visible');
                setTimeout(() => { if(!pop.classList.contains('visible')) pop.style.display = 'none'; }, 200);
            } else {
                pop.style.display = 'flex';
                // 更新色盤到當前顏色
                colorPickerInstance.color.hexString = App.strokeColor;
                // 強制重繪以避免佈局問題
                requestAnimationFrame(() => pop.classList.add('visible'));
            }
        }

        // 點擊畫布或其他地方關閉色盤
        document.addEventListener('pointerdown', (e) => {
            const pop = document.getElementById('color-popover');
            const trigger = document.getElementById('color-trigger-btn');
            if (pop.classList.contains('visible') && 
                !pop.contains(e.target) && 
                e.target !== trigger) {
                toggleColorPopover();
            }
        });

        function initSettingsUI() {
            const modal = document.getElementById('settings-modal');
            const btn = document.getElementById('btn-settings');
            const close = document.getElementById('close-settings');
            btn.onclick = () => modal.style.display = 'flex';
            close.onclick = () => modal.style.display = 'none';
            modal.onclick = (e) => { if(e.target === modal) modal.style.display = 'none'; };

            const palmCheck = document.getElementById('palm-check');
            const fingerSel = document.getElementById('finger-pressure-mode');
            const stylusSel = document.getElementById('stylus-pressure-mode');
            palmCheck.checked = Settings.palmRejection;
            fingerSel.value = Settings.fingerMode;
            stylusSel.value = Settings.stylusMode;
            palmCheck.onchange = (e) => Settings.palmRejection = e.target.checked;
            fingerSel.onchange = (e) => Settings.fingerMode = e.target.value;
            stylusSel.onchange = (e) => Settings.stylusMode = e.target.value;

            const btn34Sel = document.getElementById('btn-34-action');
            const btn33Sel = document.getElementById('btn-33-action');
            btn34Sel.value = Settings.stylusBtn34;
            btn33Sel.value = Settings.stylusBtn33;
            btn34Sel.onchange = (e) => Settings.stylusBtn34 = e.target.value;
            btn33Sel.onchange = (e) => Settings.stylusBtn33 = e.target.value;
        }

        function executeStylusAction(action) {
            switch(action) {
                case 'undo': History.undo(); break;
                case 'redo': History.redo(); break;
                case 'toggle-eraser':
                    if (App.mode === 'eraser' || App.mode === 'eraser-rect') setMode('pen'); else setMode('eraser');
                    break;
                case 'toggle-lasso':
                    if (App.mode === 'lasso') setMode('pen'); else setMode('lasso');
                    break;
                case 'next-tool':
                    const tools = ['pen', 'eraser', 'eraser-rect', 'lasso'];
                    setMode(tools[(tools.indexOf(App.mode) + 1) % tools.length]);
                    break;
                case 'none': break;
            }
        }

        function getInputPressure(e, point, prevPoint, lastTime) {
            const isStylus = e.pointerType === 'pen';
            if (!isStylus && Settings.palmRejection) return -1;
            let mode = isStylus ? Settings.stylusMode : Settings.fingerMode;
            if (App.mode === 'pen' && (App.penType === 'ballpoint' || App.penType === 'highlighter')) return 0.5;
            if (mode === 'pressure') return (e.pressure !== undefined && e.pressure !== 0) ? e.pressure : 0.5;
            else if (mode === 'speed') {
                if (!prevPoint) return 0.5;
                const dist = point.getDistance(prevPoint);
                const velocity = (Date.now() - lastTime) > 0 ? dist / (Date.now() - lastTime) : 0;
                return Math.max(0.1, Math.min(1, 1 - (velocity / 3)));
            } else return 0.5;
        }

        function initEvents() {
            const canvas = document.getElementById('canvas');
            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerUp);
            canvas.addEventListener('wheel', onWheel, { passive: false });

            document.addEventListener('keydown', (e) => {
                if (e.keyCode === 34) { e.preventDefault(); executeStylusAction(Settings.stylusBtn34); return; }
                if (e.keyCode === 33) { e.preventDefault(); executeStylusAction(Settings.stylusBtn33); return; }
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); if (e.shiftKey) History.redo(); else History.undo(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); History.redo(); }
            });

            ['pen', 'eraser', 'eraser-rect', 'lasso'].forEach(m => document.getElementById(`tool-${m}`).onclick = () => setMode(m));
            document.getElementById('tool-clear').onclick = () => { project.activeLayer.removeChildren(); clearLasso(); History.saveState(); };
            document.getElementById('btn-undo').onclick = () => History.undo();
            document.getElementById('btn-redo').onclick = () => History.redo();
            document.getElementById('lasso-dup').onclick = duplicateSelection;
            document.getElementById('lasso-del').onclick = deleteSelection;
        }

        function setMode(m) {
            if (App.mode === 'lasso' && m !== 'lasso') clearLasso();
            App.mode = m;
            document.querySelectorAll('.main-tools .btn').forEach(b => b.classList.remove('active'));
            const map = {pen:'tool-pen', eraser:'tool-eraser', 'eraser-rect':'tool-eraser-rect', lasso:'tool-lasso'};
            if(map[m]) document.getElementById(map[m]).classList.add('active');
            updateSubToolbar();
        }

        function onPointerDown(e) {
            // 如果點擊的是 UI 元素 (例如色盤)，不觸發畫布邏輯
            if (e.target.closest('.panel') || e.target.closest('#color-popover') || e.target.closest('.modal-content')) return;

            canvas.setPointerCapture(e.pointerId);
            App.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (App.activePointers.size === 2) { startGesture(); return; }

            const p = view.viewToProject(new Point(e.clientX, e.clientY));
            const pressure = getInputPressure(e, p, null, 0);
            if (pressure === -1) return;

            if (App.activePointers.size === 1 && !App.isGesturing) {
                if (App.mode === 'pen') startPenStroke(p, pressure);
                else if (App.mode === 'eraser') eraseAt(p);
                else if (App.mode === 'eraser-rect') startRectEraser(p);
                else if (App.mode === 'lasso') handleLassoDown(p);
                App.lastPointTime = Date.now();
            }
        }
        function onPointerMove(e) {
            if (App.activePointers.has(e.pointerId)) App.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (App.activePointers.size === 2) { handleGesture(); return; }
            if (App.activePointers.size === 1 && !App.isGesturing && (e.buttons || e.pointerType === 'touch')) {
                if (e.pointerType !== 'pen' && Settings.palmRejection) return;
                const rawEvents = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
                const lastP = App.currentPoints.length > 0 ? new Point(App.currentPoints[App.currentPoints.length-1]) : null;
                if (App.mode === 'pen' && App.currentPath) {
                    rawEvents.forEach(evt => {
                        const pt = view.viewToProject(new Point(evt.clientX, evt.clientY));
                        const pressure = getInputPressure(evt, pt, lastP, App.lastPointTime);
                        App.currentPoints.push({ x: pt.x, y: pt.y, pressure: pressure });
                        App.lastPointTime = Date.now();
                    });
                    renderCurrentStroke();
                } else {
                    const p = view.viewToProject(new Point(e.clientX, e.clientY));
                    if (App.mode === 'eraser') eraseAt(p);
                    else if (App.mode === 'eraser-rect') updateRectEraser(p);
                    else if (App.mode === 'lasso') handleLassoMove(p);
                }
            }
        }
        function onPointerUp(e) {
            const wasGesturing = App.isGesturing;
            App.activePointers.delete(e.pointerId);
            if (App.activePointers.size === 0) App.isGesturing = false;
            if (wasGesturing) return;
            if (App.mode === 'pen' && App.currentPath) finalizeStroke();
            else if (App.mode === 'eraser') { if (App.eraserPreview) { App.eraserPreview.remove(); App.eraserPreview = null; } History.saveState(); }
            else if (App.mode === 'eraser-rect') finalizeRectEraser();
            else if (App.mode === 'lasso') handleLassoUp();
        }

        function startPenStroke(point, pressure) {
            clearLasso(); App.currentPoints = [{ x: point.x, y: point.y, pressure: pressure }];
            App.currentPath = new Path({ fillColor: App.strokeColor, opacity: App.strokeOpacity, blendMode: App.penType === 'highlighter' ? 'multiply' : 'normal', insert: true });
        }
        function renderCurrentStroke() {
            if (!App.currentPath || App.currentPoints.length < 1) return;
            let options = { size: App.strokeWidth, start: { taper: 0, cap: true }, end: { taper: 0, cap: true }, simulatePressure: false, streamline: 0.5 };
            if (App.penType === 'fountain') { options.thinning = 0.8; options.smoothing = 0.5; } else options.thinning = 0;
            const outline = getStroke(App.currentPoints, options);
            App.currentPath.pathData = window.getSvgPathFromStroke(outline);
        }
        function finalizeStroke() {
            renderCurrentStroke(); App.currentPath.simplify(1);
            const normalized = App.currentPath.unite(App.currentPath); App.currentPath.remove();
            normalized.fillColor = App.strokeColor; normalized.opacity = App.strokeOpacity; normalized.blendMode = App.penType === 'highlighter' ? 'multiply' : 'normal';
            if (!normalized.parent) project.activeLayer.addChild(normalized);
            App.currentPath = null; App.currentPoints = []; History.saveState();
        }
        function eraseAt(point) { if (App.eraserPreview) App.eraserPreview.remove(); App.eraserPreview = new Path.Circle({ center: point, radius: App.eraserSize, strokeColor: '#EF4444', fillColor: new Color(1,0,0,0.2), strokeWidth: 1/view.zoom }); performErase(new Path.Circle({ center: point, radius: App.eraserSize, insert: false })); }
        function startRectEraser(point) { clearLasso(); App.rectStart = point; App.rectPath = new Path.Rectangle({ from: point, to: point, fillColor: new Color(1,0,0,0.1), strokeColor: '#EF4444', dashArray: [4,4], strokeWidth: 1/view.zoom }); }
        function updateRectEraser(point) { if (!App.rectPath) return; App.rectPath.remove(); App.rectPath = new Path.Rectangle({ from: App.rectStart, to: point, fillColor: new Color(1,0,0,0.1), strokeColor: '#EF4444', dashArray: [4,4], strokeWidth: 1/view.zoom }); }
        function finalizeRectEraser() { if (App.rectPath) { performErase(new Path.Rectangle(App.rectPath.bounds)); App.rectPath.remove(); App.rectPath = null; History.saveState(); } }
        function performErase(eraserItem) {
            const items = project.activeLayer.children.filter(i => i !== App.eraserPreview && i !== App.rectPath && !i.data.isLassoUI);
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                if (!item.intersects(eraserItem) && !eraserItem.contains(item.position) && !item.contains(eraserItem.position)) continue;
                if (App.eraserMode === 'object') item.remove();
                else {
                    const result = item.subtract(eraserItem); item.remove();
                    const chunks = separateDisjointPaths(result);
                    for (let c of chunks) { c.fillColor = item.fillColor; c.opacity = item.opacity; c.blendMode = item.blendMode; if (Math.abs(c.area) > 2) project.activeLayer.addChild(c); }
                    if (result !== chunks[0] && result.parent) result.remove();
                }
            }
        }
        function separateDisjointPaths(item) {
            if (item instanceof Path) return [item];
            if (item instanceof CompoundPath) {
                const children = item.removeChildren(); item.remove(); if (!children.length) return [];
                children.sort((a,b)=>Math.abs(b.area)-Math.abs(a.area)); const islands = [];
                for(let child of children){ let p = islands.find(isl => isl.body.bounds.contains(child.bounds) && isl.body.contains(child.firstSegment.point)); if(p) p.holes.push(child); else islands.push({body:child, holes:[]}); }
                return islands.map(isl => isl.holes.length ? new CompoundPath({children:[isl.body, ...isl.holes]}) : isl.body);
            } return [item];
        }
        function handleLassoDown(point) { if (App.lassoState === 'selected' && App.lassoPath.contains(point)) { App.lassoState = 'moving'; App.lassoPrevPoint = point; return; } clearLasso(); App.lassoState = 'drawing'; App.lassoPath = new Path({ strokeColor: '#3B82F6', strokeWidth: 2/view.zoom, dashArray: [5,5], data: {isLassoUI:true} }); App.lassoPath.add(point); }
        function handleLassoMove(point) { if (App.lassoState === 'drawing') App.lassoPath.add(point); else if (App.lassoState === 'moving') { const delta = point.subtract(App.lassoPrevPoint); App.lassoItems.forEach(i => i.position = i.position.add(delta)); App.lassoPath.position = App.lassoPath.position.add(delta); App.lassoPrevPoint = point; updateLassoMenu(); } }
        function handleLassoUp() { if (App.lassoState === 'drawing') { App.lassoPath.closed = true; App.lassoPath.simplify(10); const geo = App.lassoPath; App.lassoItems = project.activeLayer.children.filter(i => !i.data.isLassoUI && (geo.contains(i.bounds.center) || geo.intersects(i))); if (App.lassoItems.length > 0) { App.lassoState = 'selected'; const bounds = App.lassoItems.reduce((b,i)=>b.unite(i.bounds), App.lassoItems[0].bounds); App.lassoPath.remove(); App.lassoPath = new Path.Rectangle({ rectangle: bounds.expand(10), strokeColor: '#3B82F6', strokeWidth: 1/view.zoom, dashArray: [4,4], fillColor: new Color(0.23,0.51,0.96,0.05), data: {isLassoUI:true} }); showLassoMenu(bounds); } else clearLasso(); } else if (App.lassoState === 'moving') { App.lassoState = 'selected'; History.saveState(); } }
        function clearLasso() { if(App.lassoPath) { App.lassoPath.remove(); App.lassoPath = null; } App.lassoItems = []; App.lassoState = 'idle'; document.getElementById('lasso-actions').classList.remove('visible'); }
        function showLassoMenu(bounds) { const m = document.getElementById('lasso-actions'); const p = view.projectToView(bounds.topCenter); m.style.left = p.x + 'px'; m.style.top = (p.y - 10) + 'px'; m.classList.add('visible'); }
        function updateLassoMenu() { if(App.lassoPath) showLassoMenu(App.lassoPath.bounds); }
        function deleteSelection() { App.lassoItems.forEach(i => i.remove()); clearLasso(); History.saveState(); }
        function duplicateSelection() { const cs = App.lassoItems.map(i => { const c = i.clone(); c.position = c.position.add([20,20]); project.activeLayer.addChild(c); return c; }); clearLasso(); History.saveState(); }

        function updateSubToolbar() {
            const el = document.getElementById('sub-toolbar'); el.innerHTML = '';
            if (App.mode === 'pen') {
                const g = document.createElement('div'); g.className='opt-group';
                [{id:'fountain',t:'鋼筆'}, {id:'ballpoint',t:'圓珠筆'}, {id:'highlighter',t:'螢光筆'}].forEach(o=>{
                    const d=document.createElement('div'); d.className=`opt-btn ${App.penType===o.id?'selected':''}`; d.innerText=o.t;
                    d.onclick=()=>{ App.penType=o.id; if(o.id==='highlighter'){App.strokeColor='#FEF08A';App.strokeOpacity=0.5;App.strokeWidth=20;}else{if(App.strokeColor==='#FEF08A')App.strokeColor='#1E293B';App.strokeOpacity=1;App.strokeWidth=o.id==='ballpoint'?3:8;} updateSubToolbar();}; g.appendChild(d);
                }); el.appendChild(g);
                
                // 顏色按鈕 (呼叫 iro.js)
                const cw = document.createElement('div'); cw.className='setting-item'; 
                cw.innerHTML=`<div id="color-trigger-btn" class="color-trigger" style="background:${App.strokeColor}"></div>`;
                cw.onclick = (e) => { e.stopPropagation(); toggleColorPopover(); };
                el.appendChild(cw);

                addSlider(el,'粗細',1,40,App.strokeWidth,v=>App.strokeWidth=v); addSlider(el,'透明度',1,100,App.strokeOpacity*100,v=>App.strokeOpacity=v/100);
            } else if (App.mode.startsWith('eraser')) {
                const g=document.createElement('div'); g.className='opt-group';
                [{id:'standard',t:'擦部分'}, {id:'object',t:'擦整條'}].forEach(o=>{ const d=document.createElement('div'); d.className=`opt-btn ${App.eraserMode===o.id?'selected':''}`; d.innerText=o.t; d.onclick=()=>{App.eraserMode=o.id; updateSubToolbar();}; g.appendChild(d); }); el.appendChild(g);
                if(App.mode==='eraser') addSlider(el,'大小',5,100,App.eraserSize,v=>App.eraserSize=v);
            } else if (App.mode === 'lasso') el.innerHTML = '<span style="color:#64748B;font-size:12px">圈選後可移動、複製或刪除</span>';
        }
        function addSlider(p,l,min,max,v,cb){ const w=document.createElement('div'); w.className='setting-item'; w.innerHTML=`<span style="font-size:12px">${l}</span><input type="range" min="${min}" max="${max}" value="${v}">`; w.querySelector('input').oninput=(e)=>cb(parseInt(e.target.value)); p.appendChild(w); }

        function startGesture() { App.isGesturing = true; if(App.currentPath){App.currentPath.remove();App.currentPath=null;} const p=Array.from(App.activePointers.values()); App.prevDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); App.prevC={x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; }
        function handleGesture() { const p=Array.from(App.activePointers.values()); const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); const c={x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; if(App.prevDist>0){ const s=dist/App.prevDist; const p1=view.viewToProject(new Point(App.prevC.x,App.prevC.y)); view.scale(s,p1); view.center=view.center.add(p1.subtract(view.viewToProject(new Point(c.x,c.y)))); } App.prevDist=dist; App.prevC=c; if(App.lassoPath){ App.lassoPath.strokeWidth=1/view.zoom; updateLassoMenu(); } if(App.eraserPreview) App.eraserPreview.strokeWidth=1/view.zoom; }
        function onWheel(e) { e.preventDefault(); const z = e.deltaY>0?1/1.05:1.05; view.scale(z, view.viewToProject(new Point(e.clientX, e.clientY))); if(App.lassoPath){App.lassoPath.strokeWidth=1/view.zoom; updateLassoMenu();} }

    </script>
</body>
</html>
