<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Map (Fit Screen Layout)</title>
    
    <!-- 外部資源 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2979ff;       
            --primary-dark: #1565c0;  
            --bg-body: #f5f5f5;       
            --bg-card: #ffffff;       
            --text-main: #333333;     
            --border: #e0e0e0;        
            --shadow: 0 10px 40px rgba(0,0,0,0.4); 
        }

        body { margin: 0; background: var(--bg-body); font-family: 'Roboto', sans-serif; overflow: hidden; color: var(--text-main); }
        
        #map { width: 100vw; height: 100vh; background: #e6e6e6; z-index: 1; }

        /* --- 1. 實心圖釘樣式 --- */
        .custom-pin { background: transparent; }
        
        .pin-body {
            width: 36px; height: 36px;
            background: #ffffff;
            border: 2px solid var(--primary);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4); 
            display: flex; align-items: center; justify-content: center;
            opacity: 1;
            transition: all 0.2s;
            z-index: 100;
        }
        
        .pin-body i { 
            transform: rotate(45deg); 
            color: var(--primary); 
            font-size: 20px; 
            font-weight: bold;
        }

        .pin-body:hover { 
            transform: rotate(-45deg) scale(1.2); 
            background: var(--primary); 
            border-color: #fff; 
            z-index: 999;
        }
        .pin-body:hover i { color: #fff; }
        
        /* 實心聚合群組 */
        .cluster-custom {
            background: #e3f2fd; 
            border: 2px solid var(--primary);
            border-radius: 50%;
            color: var(--primary-dark);
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            opacity: 1;
        }

        /* --- 2. 完美適應螢幕的彈窗樣式 --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
            
            /* 四周保留空隙：最少 20px，如果螢幕夠大則留 3% */
            padding: max(20px, 3%); 
            box-sizing: border-box; 
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .player-card {
            width: 100%; 
            max-width: 900px; /* 最大寬度 */
            height: 100%;     /* 嘗試佔滿高度 (會被 overlay 的 padding 限制) */
            max-height: 600px; /* 限制最大高度，避免在大螢幕上太高 */
            
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            
            /* 關鍵 Flexbox 設定：垂直排列 */
            display: flex; 
            flex-direction: column;
            
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        
        /* 在手機直式螢幕，允許卡片稍微高一點以容納內容 */
        @media (max-aspect-ratio: 1/1) {
            .player-card { max-height: 80vh; } 
        }

        .modal-overlay.active .player-card { transform: scale(1); }

        /* 2.1 標題區 (固定高度) */
        .card-header {
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            background: #fff;
            flex-shrink: 0; /* 禁止被壓縮 */
        }
        .cam-title { margin: 0; font-size: 16px; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;}
        .close-btn {
            background: #f5f5f5; border: none; color: #666; cursor: pointer;
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .close-btn:hover { background: #ffebee; color: #c62828; }

        /* 2.2 進度條 (固定高度) */
        .refresh-bar {
            height: 4px; background: var(--primary); width: 0%;
            transition: width 0.1s linear;
            flex-shrink: 0; /* 禁止被壓縮 */
        }

        /* 2.3 影片區 (自動縮放，佔滿剩餘空間) */
        .video-wrapper-outer {
            background: #000;
            flex: 1;          /* 佔據所有剩餘空間 */
            min-height: 0;    /* 允許 Flexbox 在內容過大時正確縮小 */
            
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 圖片關鍵樣式：保持比例，完整顯示，絕不切邊 */
        .video-container img {
            max-width: 100%;
            max-height: 100%; 
            width: auto;
            height: auto;
            object-fit: contain; /* 確保圖片完整顯示在框內 */
        }

        .paused-overlay {
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.15); 
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; font-weight: bold; letter-spacing: 2px;
            display: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .video-wrapper-outer.paused .paused-overlay { display: flex; }

        /* 2.4 按鈕區 (固定高度) */
        .card-controls {
            padding: 12px;
            background: #fff;
            display: flex; justify-content: center; gap: 15px;
            border-top: 1px solid var(--border);
            flex-shrink: 0; /* 禁止被壓縮，保證按鈕可見 */
        }
        .ctrl-btn {
            background: #fff; color: var(--text-main); border: 1px solid #ccc;
            padding: 8px 20px; border-radius: 30px;
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; font-size: 14px; font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap; /* 禁止文字換行 */
        }
        .ctrl-btn:hover { background: #f8f8f8; transform: translateY(-2px); }
        .ctrl-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(41, 121, 255, 0.4); }

        /* Loading */
        #loading {
            position: fixed; inset: 0; background: #fff; z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--primary);
        }
        .spinner {
            width: 45px; height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div style="font-weight: 500; letter-spacing: 1px; color:#555;">SYSTEM LOADING...</div>
    </div>

    <div id="map"></div>

    <div class="modal-overlay" id="modal">
        <div class="player-card">
            <!-- 標題 (固定高度) -->
            <div class="card-header">
                <h3 class="cam-title">
                    <i class="material-icons" style="color:var(--primary)">videocam</i> 
                    <span id="modal-title">Camera</span>
                </h3>
                <button class="close-btn" onclick="closeModal()"><i class="material-icons">close</i></button>
            </div>
            
            <!-- 進度條 (固定高度) -->
            <div class="refresh-bar" id="refresh-progress"></div>

            <!-- 影片 (自動伸縮，佔滿中間) -->
            <div class="video-wrapper-outer" id="video-wrapper-outer">
                <div class="video-container">
                    <img id="cctv-img" src="" alt="Connecting...">
                </div>
                <div class="paused-overlay">PAUSED</div>
            </div>

            <!-- 按鈕 (固定高度) -->
            <div class="card-controls">
                <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">
                    <i class="material-icons" id="icon-play">pause</i> <span id="text-play">暫停</span>
                </button>
                <button class="ctrl-btn" onclick="toggleFullscreen()">
                    <i class="material-icons">fullscreen</i> 全螢幕
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        const PROXY_URL = "https://cors-anywhere.potatosserver.workers.dev/?url=https://www.twipcam.com/api/v1/cam-list.json";
        
        let map, clusterGroup;
        let currentCamUrl = "";
        let isPlaying = false;
        let refreshTimer = null; 

        // 1. 初始化地圖
        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([23.8, 121.0], 8);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            clusterGroup = L.markerClusterGroup({
                showCoverageOnHover: false,
                removeOutsideVisibleBounds: true,
                iconCreateFunction: function(cluster) {
                    return L.divIcon({
                        html: `<div>${cluster.getChildCount()}</div>`,
                        className: 'cluster-custom', 
                        iconSize: L.point(40, 40)
                    });
                }
            });
            map.addLayer(clusterGroup);
        }

        // 2. 建立實心圖釘
        function createMarker(cam) {
            const icon = L.divIcon({
                className: 'custom-pin',
                html: `<div class="pin-body"><i class="material-icons">videocam</i></div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 38]
            });
            const marker = L.marker([cam.lat, cam.lon], { icon: icon });
            marker.on('click', () => { openModal(cam); });
            return marker;
        }

        // 3. 載入資料
        async function loadData() {
            try {
                const res = await fetch(PROXY_URL);
                if(!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                const validData = data.filter(d => d.lat && d.lon && d.cam_url);
                clusterGroup.addLayers(validData.map(cam => createMarker(cam)));
                document.getElementById('loading').style.display = 'none';
            } catch (e) {
                document.getElementById('loading').innerHTML = `<div style="color:red">LOAD FAILED</div><br>請重新整理`;
            }
        }

        // --- 播放器邏輯 ---

        function openModal(cam) {
            document.getElementById('modal-title').innerText = cam.name;
            currentCamUrl = cam.cam_url;
            document.getElementById('modal').classList.add('active');
            playVideo();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            pauseVideo();
        }

        function togglePlay() {
            isPlaying ? pauseVideo() : playVideo();
        }

        function playVideo() {
            const img = document.getElementById('cctv-img');
            const wrapper = document.getElementById('video-wrapper-outer');
            const btn = document.getElementById('btn-play');
            const icon = document.getElementById('icon-play');
            const text = document.getElementById('text-play');
            const bar = document.getElementById('refresh-progress');

            if (refreshTimer) clearTimeout(refreshTimer);

            const timestamp = new Date().getTime();
            const separator = currentCamUrl.includes('?') ? '&' : '?';
            img.src = `${currentCamUrl}${separator}t=${timestamp}`;

            refreshTimer = setTimeout(() => {
                console.log("Auto refreshing stream...");
                playVideo();
            }, 5000); 

            isPlaying = true;
            wrapper.classList.remove('paused');
            btn.classList.add('active');
            icon.innerText = "pause";
            text.innerText = "暫停";
            
            bar.style.transition = 'none';
            bar.style.width = '0%';
            void bar.offsetWidth; 
            bar.style.transition = 'width 5s linear';
            bar.style.width = '100%';
        }

        function pauseVideo() {
            const img = document.getElementById('cctv-img');
            const wrapper = document.getElementById('video-wrapper-outer');
            const btn = document.getElementById('btn-play');
            const icon = document.getElementById('icon-play');
            const text = document.getElementById('text-play');
            const bar = document.getElementById('refresh-progress');

            if (refreshTimer) clearTimeout(refreshTimer);
            refreshTimer = null;

            img.src = "";
            
            isPlaying = false;
            wrapper.classList.add('paused');
            btn.classList.remove('active');
            icon.innerText = "play_arrow";
            text.innerText = "播放";
            
            bar.style.transition = 'none';
            bar.style.width = '0%';
        }

        function toggleFullscreen() {
            const elem = document.getElementById('video-wrapper-outer');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        initMap();
        loadData();

    </script>
</body>
</html>
