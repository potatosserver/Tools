<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 手機版面適配 -->
    <title>廣角智能掃描儀</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 10px; }
        
        /* 響應式容器 */
        .container { position: relative; width: 100%; max-width: 640px; margin: 0 auto; }
        
        /* 影像疊加層 */
        video { width: 100%; height: auto; display: block; border-radius: 8px; }
        canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        /* 結果顯示 */
        #resultContainer { margin-top: 20px; display: none; }
        canvas.result { width: 100%; border: 2px solid #fff; border-radius: 8px; }

        /* 控制按鈕 */
        .controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 10px; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 50px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #scanBtn { background: #28a745; color: white; font-weight: bold; }
        #scanBtn:disabled { background: #555; }
        #retryBtn { background: #dc3545; color: white; display: none; }

        #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 20; }
    </style>
</head>
<body>

    <div id="status">載入系統中...</div>

    <div class="container">
        <video id="videoInput" playsinline muted></video>
        <canvas id="canvasOverlay" class="overlay"></canvas>
    </div>

    <div class="controls">
        <button id="scanBtn" disabled>📸 掃描</button>
        <button id="retryBtn">🔄 重來</button>
    </div>

    <div id="resultContainer">
        <h3>掃描結果</h3>
        <canvas id="canvasResult" class="result"></canvas>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>

    <script>
        let video = document.getElementById("videoInput");
        let canvasOverlay = document.getElementById("canvasOverlay");
        let ctxOverlay = canvasOverlay.getContext("2d");
        let canvasResult = document.getElementById("canvasResult");
        let scanBtn = document.getElementById("scanBtn");
        let retryBtn = document.getElementById("retryBtn");
        let status = document.getElementById("status");
        let resultContainer = document.getElementById("resultContainer");

        let streaming = false;
        let src = null;       // 原始高解析度圖
        let dstSmall = null;  // 縮小後的圖 (給運算用)
        let gray = null;
        let cap = null;
        let detectedContour = null; // 儲存的是「小圖」的座標
        let scaleRatio = 1;   // 縮放倍率

        function onOpenCvReady() {
            status.innerText = "系統就緒，啟動相機...";
            startCamera();
        }

        function startCamera() {
            // 關鍵修改：請求高解析度 (HD/FHD)，這通常會叫出廣角模式
            const constraints = {
                video: {
                    facingMode: "environment", // 後鏡頭
                    width: { ideal: 1920 },    // 請求 1920 (盡量寬)
                    height: { ideal: 1080 }    // 請求 1080
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    video.oncanplay = function() {
                        if (!streaming) {
                            streaming = true;
                            // 設定 Canvas 尺寸與 Video 實際尺寸一致
                            canvasOverlay.width = video.videoWidth;
                            canvasOverlay.height = video.videoHeight;
                            
                            initOpenCV();
                            requestAnimationFrame(processVideo);
                            scanBtn.disabled = false;
                            status.innerText = `解析度: ${video.videoWidth}x${video.videoHeight} (廣角模式)`;
                        }
                    };
                })
                .catch(err => {
                    status.innerText = "無法開啟相機";
                    console.error(err);
                });
        }

        function initOpenCV() {
            src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            dstSmall = new cv.Mat(); // 這裡不指定大小，後面 resize 會自動分配
            gray = new cv.Mat();
            cap = new cv.VideoCapture(video);
        }

        function processVideo() {
            if (!streaming) return;

            try {
                // 1. 讀取原始高畫質影像
                cap.read(src);

                // 2. 🌟 縮小影像來運算 (效能關鍵)
                // 我們把寬度固定縮到 500px，這樣運算超快，也不影響大圖
                let targetWidth = 500;
                scaleRatio = video.videoWidth / targetWidth; // 計算倍率 (例如 1920/500 = 3.84倍)
                let targetHeight = video.videoHeight / scaleRatio;
                let dsize = new cv.Size(targetWidth, targetHeight);
                
                cv.resize(src, dstSmall, dsize, 0, 0, cv.INTER_AREA);

                // 3. 在「小圖」上做處理
                cv.cvtColor(dstSmall, gray, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
                // 使用較低閥值與膨脹來適應不同環境
                cv.Canny(gray, gray, 30, 100); 
                let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
                cv.dilate(gray, gray, kernel);

                // 4. 找輪廓 (在小圖上找)
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                detectedContour = null;
                let approx = new cv.Mat();

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if (area > 1000) { // 小圖上的面積閥值
                        let peri = cv.arcLength(cnt, true);
                        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                        if (approx.rows === 4 && area > maxArea && cv.isContourConvex(approx)) {
                            maxArea = area;
                            if (detectedContour) detectedContour.delete();
                            detectedContour = approx.clone();
                        }
                    }
                }

                // 5. 畫框 (要把小圖座標 放大回 大圖顯示)
                ctxOverlay.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
                if (detectedContour) {
                    drawScaledContour(detectedContour, scaleRatio);
                }

                // 釋放記憶體
                contours.delete(); hierarchy.delete(); approx.delete(); 
                // kernel 也可以釋放，或者拉到外面變全域變數

                requestAnimationFrame(processVideo);
            } catch (err) {
                console.error(err);
            }
        }

        // 輔助：畫出放大後的框
        function drawScaledContour(cnt, scale) {
            ctxOverlay.beginPath();
            ctxOverlay.lineWidth = 5; // 線條粗一點
            ctxOverlay.strokeStyle = "#00FF00";
            
            let data = cnt.data32S;
            // 每個座標都要乘上 scaleRatio
            ctxOverlay.moveTo(data[0] * scale, data[1] * scale);
            for (let i = 2; i < data.length; i += 2) {
                ctxOverlay.lineTo(data[i] * scale, data[i + 1] * scale);
            }
            ctxOverlay.closePath();
            ctxOverlay.stroke();
        }

        // === 掃描按鈕 ===
        scanBtn.addEventListener('click', () => {
            if (!detectedContour) {
                alert("未偵測到邊緣");
                return;
            }
            
            // 暫停畫面
            streaming = false;
            scanBtn.style.display = 'none';
            retryBtn.style.display = 'inline-block';
            resultContainer.style.display = 'block';

            // 1. 還原座標到原始解析度
            let data = detectedContour.data32S;
            let points = [
                { x: data[0] * scaleRatio, y: data[1] * scaleRatio },
                { x: data[2] * scaleRatio, y: data[3] * scaleRatio },
                { x: data[4] * scaleRatio, y: data[5] * scaleRatio },
                { x: data[6] * scaleRatio, y: data[7] * scaleRatio }
            ];
            
            // 2. 排序座標
            let sorted = sortCorners(points);

            // 3. 計算大圖的寬高
            let w1 = Math.hypot(sorted[1].x - sorted[0].x, sorted[1].y - sorted[0].y);
            let w2 = Math.hypot(sorted[2].x - sorted[3].x, sorted[2].y - sorted[3].y);
            let maxWidth = Math.max(w1, w2);
            let h1 = Math.hypot(sorted[3].x - sorted[0].x, sorted[3].y - sorted[0].y);
            let h2 = Math.hypot(sorted[2].x - sorted[1].x, sorted[2].y - sorted[1].y);
            let maxHeight = Math.max(h1, h2);

            // 4. 透視變換 (在原始 src 上操作，畫質最棒)
            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                sorted[0].x, sorted[0].y, sorted[1].x, sorted[1].y,
                sorted[2].x, sorted[2].y, sorted[3].x, sorted[3].y
            ]);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0,0, maxWidth,0, maxWidth,maxHeight, 0,maxHeight]);
            
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let dst = new cv.Mat();
            let dsize = new cv.Size(maxWidth, maxHeight);
            
            cv.warpPerspective(src, dst, M, dsize);

            // 5. 影像增強 (二值化)
            cv.cvtColor(dst, dst, cv.COLOR_RGBA2GRAY);
            cv.adaptiveThreshold(dst, dst, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 21, 10);

            // 6. 顯示
            cv.imshow('canvasResult', dst);

            // 清理
            srcTri.delete(); dstTri.delete(); M.delete(); dst.delete();
        });

        retryBtn.addEventListener('click', () => {
            streaming = true;
            scanBtn.style.display = 'inline-block';
            retryBtn.style.display = 'none';
            resultContainer.style.display = 'none';
            requestAnimationFrame(processVideo);
        });

        function sortCorners(pts) {
            pts.sort((a, b) => a.y - b.y);
            let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
            let bot = pts.slice(2, 4).sort((a, b) => a.x - b.x);
            return [top[0], top[1], bot[1], bot[0]]; 
        }
    </script>
</body>
</html>
