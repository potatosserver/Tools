<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>廣角全螢幕掃描儀</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* 視訊層：填滿螢幕 */
        .camera-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; } /* cover 讓畫面填滿，但可能會切邊，我們後續用 JS 修正 */
        
        /* 繪圖層：覆蓋在視訊上 */
        canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        
        /* 提示文字 */
        #status { position: absolute; top: 20px; left: 0; width: 100%; text-align: center; color: white; text-shadow: 1px 1px 2px black; z-index: 3; pointer-events: none; font-size: 16px; }
        
        /* 按鈕區 */
        .controls { position: fixed; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: rgba(0,0,0,0.3); color: #fff; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #scanBtn.ready { background: #28a745; border-color: #fff; box-shadow: 0 0 15px #28a745; }
        
        /* 結果預覽層 */
        .result-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; }
        canvas.result-canvas { max-width: 90%; max-height: 80%; border: 2px solid #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .result-btns { margin-top: 20px; display: flex; gap: 20px; }
        .rect-btn { width: auto; height: auto; padding: 10px 30px; border-radius: 30px; font-size: 16px; background: #fff; color: #000; border: none; }
    </style>
</head>
<body>

    <div id="status">啟動廣角相機中...</div>

    <div class="camera-view">
        <video id="videoInput" playsinline muted autoplay></video>
        <canvas id="canvasOverlay" class="overlay"></canvas>
    </div>

    <div class="controls" id="cameraControls">
        <button id="scanBtn" class="btn">偵測中</button>
    </div>

    <div class="result-layer" id="resultLayer">
        <canvas id="canvasResult" class="result-canvas"></canvas>
        <div class="result-btns">
            <button id="retryBtn" class="rect-btn">重拍</button>
            <button id="saveBtn" class="rect-btn" style="background:#007bff; color:fff;">下載</button>
        </div>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>

    <script>
        let video = document.getElementById("videoInput");
        let canvasOverlay = document.getElementById("canvasOverlay");
        let ctxOverlay = canvasOverlay.getContext("2d");
        let status = document.getElementById("status");
        let scanBtn = document.getElementById("scanBtn");
        let resultLayer = document.getElementById("resultLayer");
        let canvasResult = document.getElementById("canvasResult");

        let streaming = false;
        let src = null;
        let dst = null; // 縮圖
        let gray = null;
        let cap = null;
        let detectedContour = null;
        
        // 用來計算座標映射的參數
        let scaleFactor = 1; 
        let videoRenderW, videoRenderH, offsetX, offsetY;

        function onOpenCvReady() {
            startCamera();
        }

        function startCamera() {
            // 🌟 關鍵修改：請求 4K 解析度
            // 這會強迫平板使用最廣角的鏡頭，並提供最高畫質
            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 3840 },  
                    height: { ideal: 2160 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    video.srcObject = stream;
                    video.onloadedmetadata = function(e) {
                        video.play();
                        status.innerText = `解析度: ${video.videoWidth}x${video.videoHeight} (全螢幕模式)`;
                        if (!streaming) {
                            streaming = true;
                            resizeCanvas();
                            window.addEventListener('resize', resizeCanvas);
                            
                            initOpenCV();
                            requestAnimationFrame(processVideo);
                        }
                    };
                })
                .catch(err => {
                    status.innerText = "相機錯誤: " + err.name;
                });
        }

        // 處理視窗縮放與 object-fit: cover 的座標計算
        function resizeCanvas() {
            canvasOverlay.width = window.innerWidth;
            canvasOverlay.height = window.innerHeight;
        }

        function initOpenCV() {
            src = new cv.Mat();
            dst = new cv.Mat();
            gray = new cv.Mat();
        }

        function processVideo() {
            if (!streaming) return;

            try {
                if (!cap) cap = new cv.VideoCapture(video);
                cap.read(src); // 讀取原始高畫質影像

                // 1. 縮小影像以加快運算 (寬度固定 600)
                // 越小越快，且對淺色邊緣的模糊容忍度越高
                let processWidth = 600;
                scaleFactor = src.cols / processWidth;
                let processHeight = src.rows / scaleFactor;
                cv.resize(src, dst, new cv.Size(processWidth, processHeight), 0, 0, cv.INTER_AREA);

                // 2. 影像處理 (針對淺色桌面優化)
                cv.cvtColor(dst, gray, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
                // 使用較低閥值來抓取微弱邊緣
                cv.Canny(gray, gray, 30, 120); 
                
                // 膨脹操作 (把斷掉的線連起來)
                let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
                cv.dilate(gray, gray, kernel);
                cv.dilate(gray, gray, kernel); // 兩次膨脹更保險

                // 3. 找輪廓
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                detectedContour = null;
                let approx = new cv.Mat();

                // 畫面總面積 (小圖)
                let totalArea = processWidth * processHeight;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);

                    // 條件：面積要夠大 (畫面 1/10 以上)，避免抓到小雜訊
                    if (area > totalArea * 0.1) {
                        let peri = cv.arcLength(cnt, true);
                        // 0.03 的擬合度比較寬鬆，適合稍微彎曲的紙張
                        cv.approxPolyDP(cnt, approx, 0.03 * peri, true);

                        if (approx.rows === 4 && cv.isContourConvex(approx) && area > maxArea) {
                            maxArea = area;
                            if (detectedContour) detectedContour.delete();
                            detectedContour = approx.clone();
                        }
                    }
                }

                // 4. 繪製 (座標映射)
                ctxOverlay.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
                calculateRenderParams(); // 計算 video 在螢幕上的實際顯示位置

                if (detectedContour) {
                    drawResult(detectedContour);
                    scanBtn.innerText = "拍照";
                    scanBtn.classList.add('ready');
                } else {
                    scanBtn.innerText = "偵測中";
                    scanBtn.classList.remove('ready');
                    // 沒抓到時，畫一個全螢幕的半透明引導框
                    drawGuide();
                }

                // 清理
                contours.delete(); hierarchy.delete(); approx.delete(); kernel.delete();

                requestAnimationFrame(processVideo);
            } catch (err) {
                console.error(err);
            }
        }

        // 計算 video (object-fit: cover) 在 Canvas 上的真實偏移量
        function calculateRenderParams() {
            let screenRatio = canvasOverlay.width / canvasOverlay.height;
            let videoRatio = video.videoWidth / video.videoHeight;

            if (screenRatio > videoRatio) {
                // 螢幕比較寬，影片上下裁切 (還是左右？ cover 邏輯)
                // 螢幕寬度 = 影片渲染寬度
                videoRenderW = canvasOverlay.width;
                videoRenderH = videoRenderW / videoRatio;
                offsetX = 0;
                offsetY = (canvasOverlay.height - videoRenderH) / 2;
            } else {
                // 螢幕比較高，影片左右裁切
                videoRenderH = canvasOverlay.height;
                videoRenderW = videoRenderH * videoRatio;
                offsetX = (canvasOverlay.width - videoRenderW) / 2;
                offsetY = 0;
            }
        }

        function drawResult(cnt) {
            ctxOverlay.beginPath();
            ctxOverlay.lineWidth = 5;
            ctxOverlay.strokeStyle = "#00ff00"; // 亮綠色
            ctxOverlay.lineJoin = "round";

            let data = cnt.data32S;
            // 座標轉換公式：
            // (小圖座標 * 縮放比) -> 原始影片座標
            // (原始影片座標 / 原始影片寬) * 渲染寬 + 偏移 -> 螢幕座標
            
            let mapX = (x) => (x * scaleFactor) / video.videoWidth * videoRenderW + offsetX;
            let mapY = (y) => (y * scaleFactor) / video.videoHeight * videoRenderH + offsetY;

            ctxOverlay.moveTo(mapX(data[0]), mapY(data[1]));
            for (let i = 2; i < data.length; i += 2) {
                ctxOverlay.lineTo(mapX(data[i]), mapY(data[i+1]));
            }
            ctxOverlay.closePath();
            ctxOverlay.stroke();

            // 畫一個半透明填充，更有質感
            ctxOverlay.fillStyle = "rgba(0, 255, 0, 0.2)";
            ctxOverlay.fill();
        }

        function drawGuide() {
            // 畫四個角落的提示框
            let w = canvasOverlay.width;
            let h = canvasOverlay.height;
            let m = 50; // margin
            let l = 30; // length
            
            ctxOverlay.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctxOverlay.lineWidth = 3;
            ctxOverlay.beginPath();
            // 左上
            ctxOverlay.moveTo(m, m+l); ctxOverlay.lineTo(m, m); ctxOverlay.lineTo(m+l, m);
            // 右上
            ctxOverlay.moveTo(w-m-l, m); ctxOverlay.lineTo(w-m, m); ctxOverlay.lineTo(w-m, m+l);
            // 右下
            ctxOverlay.moveTo(w-m, h-m-l); ctxOverlay.lineTo(w-m, h-m); ctxOverlay.lineTo(w-m-l, h-m);
            // 左下
            ctxOverlay.moveTo(m+l, h-m); ctxOverlay.lineTo(m, h-m); ctxOverlay.lineTo(m, h-m-l);
            ctxOverlay.stroke();
        }

        // === 拍照與透視變換 ===
        scanBtn.addEventListener('click', () => {
            if (!streaming) return;

            // 1. 決定要裁切的點
            let finalPoints = [];
            if (detectedContour) {
                let data = detectedContour.data32S;
                for(let i=0; i<8; i+=2) {
                    // 還原回原始高畫質圖的座標
                    finalPoints.push({ x: data[i] * scaleFactor, y: data[i+1] * scaleFactor });
                }
            } else {
                // 沒偵測到，就拍全螢幕 (這在廣角模式下很有用)
                // 這裡需要計算螢幕可見範圍對應到 Video 的座標 (因為 object-fit: cover)
                // 簡單起見，我們直接拍視訊中心的一塊區域
                let vw = video.videoWidth;
                let vh = video.videoHeight;
                finalPoints = [
                    {x: vw*0.1, y: vh*0.1}, {x: vw*0.9, y: vh*0.1},
                    {x: vw*0.9, y: vh*0.9}, {x: vw*0.1, y: vh*0.9}
                ];
                alert("未偵測到邊緣，將拍攝畫面中央區域");
            }

            // 2. 排序座標
            let sorted = sortCorners(finalPoints);

            // 3. 透視變換
            let w1 = Math.hypot(sorted[1].x - sorted[0].x, sorted[1].y - sorted[0].y);
            let w2 = Math.hypot(sorted[2].x - sorted[3].x, sorted[2].y - sorted[3].y);
            let maxWidth = Math.max(w1, w2);
            let h1 = Math.hypot(sorted[3].x - sorted[0].x, sorted[3].y - sorted[0].y);
            let h2 = Math.hypot(sorted[2].x - sorted[1].x, sorted[2].y - sorted[1].y);
            let maxHeight = Math.max(h1, h2);

            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                sorted[0].x, sorted[0].y, sorted[1].x, sorted[1].y,
                sorted[2].x, sorted[2].y, sorted[3].x, sorted[3].y
            ]);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0,0, maxWidth,0, maxWidth,maxHeight, 0,maxHeight]);
            
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let resultMat = new cv.Mat();
            let dsize = new cv.Size(maxWidth, maxHeight);
            
            cv.warpPerspective(src, resultMat, M, dsize);

            // 4. 濾鏡處理
            cv.cvtColor(resultMat, resultMat, cv.COLOR_RGBA2GRAY);
            cv.adaptiveThreshold(resultMat, resultMat, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 15, 10);

            // 5. 顯示
            cv.imshow('canvasResult', resultMat);
            resultLayer.style.display = 'flex';
            document.getElementById('cameraControls').style.display = 'none';
            streaming = false;

            // 清理
            srcTri.delete(); dstTri.delete(); M.delete(); resultMat.delete();
        });

        document.getElementById('retryBtn').addEventListener('click', () => {
            resultLayer.style.display = 'none';
            document.getElementById('cameraControls').style.display = 'flex';
            streaming = true;
            requestAnimationFrame(processVideo);
        });

        function sortCorners(pts) {
            pts.sort((a, b) => a.y - b.y);
            let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
            let bot = pts.slice(2, 4).sort((a, b) => a.x - b.x);
            return [top[0], top[1], bot[1], bot[0]];
        }
    </script>
</body>
</html>
