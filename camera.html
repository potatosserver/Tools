<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenCV 視覺分析儀</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: monospace; overflow-x: hidden; }
        
        /* 上半部：主畫面 */
        .main-stage { position: relative; width: 100vw; height: 50vh; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* 下半部：四個偵錯視窗 */
        .debug-grid { display: flex; flex-wrap: wrap; height: 50vh; width: 100vw; background: #222; }
        .debug-box { width: 50%; height: 50%; position: relative; border: 1px solid #444; box-sizing: border-box; }
        .debug-box canvas { width: 100%; height: 100%; object-fit: contain; }
        .label { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.7); padding: 2px 5px; font-size: 12px; color: #0f0; }
        .score { position: absolute; bottom: 5px; right: 5px; font-weight: bold; font-size: 14px; }

        /* 贏家高亮 */
        .winner { border: 3px solid #0f0; z-index: 10; }

        #status { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; z-index: 20; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>

    <div id="status">載入分析模組...</div>

    <!-- 主畫面：顯示原始影像 + 最佳預測框 -->
    <div class="main-stage">
        <video id="videoInput" playsinline muted autoplay></video>
        <canvas id="canvasOverlay"></canvas>
    </div>

    <!-- 偵錯網格：顯示 4 種演算法的「腦中畫面」 -->
    <div class="debug-grid">
        <div class="debug-box" id="box1">
            <div class="label">1. Canny (邊緣)</div>
            <canvas id="c1"></canvas>
            <div class="score" id="s1">Score: 0</div>
        </div>
        <div class="debug-box" id="box2">
            <div class="label">2. HSV (飽和度)</div>
            <canvas id="c2"></canvas>
            <div class="score" id="s2">Score: 0</div>
        </div>
        <div class="debug-box" id="box3">
            <div class="label">3. Blur+Otsu (亮度)</div>
            <canvas id="c3"></canvas>
            <div class="score" id="s3">Score: 0</div>
        </div>
        <div class="debug-box" id="box4">
            <div class="label">4. Adaptive (自適應)</div>
            <canvas id="c4"></canvas>
            <div class="score" id="s4">Score: 0</div>
        </div>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>

    <script>
        let video = document.getElementById("videoInput");
        let canvasOverlay = document.getElementById("canvasOverlay");
        let ctxOverlay = canvasOverlay.getContext("2d");
        
        // Debug Canvases
        let debugs = [
            document.getElementById("c1"),
            document.getElementById("c2"),
            document.getElementById("c3"),
            document.getElementById("c4")
        ];
        let scores = [
            document.getElementById("s1"),
            document.getElementById("s2"),
            document.getElementById("s3"),
            document.getElementById("s4")
        ];
        let boxes = [
            document.getElementById("box1"),
            document.getElementById("box2"),
            document.getElementById("box3"),
            document.getElementById("box4")
        ];

        let streaming = false;
        let src = null, small = null;
        // Mats for pipelines
        let gray = null, blur = null, edge = null; // Pipeline 1 & 4
        let hsv = null, sat = null, planes = null; // Pipeline 2
        let binary = null; // Pipeline 3
        
        // Contours
        let contours = null, hierarchy = null, approx = null;

        // 渲染映射參數
        let renderW, renderH, offsetX, offsetY;

        function onOpenCvReady() {
            startCamera();
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 3840 }, height: { ideal: 2160 } },
                audio: false
            }).then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    resizeLayout();
                    window.addEventListener('resize', resizeLayout);
                    streaming = true;
                    initOpenCV();
                    requestAnimationFrame(processVideo);
                    document.getElementById("status").innerText = "分析中... 綠框代表最佳演算法";
                };
            }).catch(e => alert(e));
        }

        function resizeLayout() {
            let w = window.innerWidth;
            let h = window.innerHeight / 2; // 主畫面佔一半
            canvasOverlay.width = w;
            canvasOverlay.height = h;
            
            // 計算 object-fit: cover 的真實渲染區域
            if (video.videoWidth) {
                let vRatio = video.videoWidth / video.videoHeight;
                let sRatio = w / h;
                if (sRatio > vRatio) {
                    renderW = w; renderH = w / vRatio;
                    offsetX = 0; offsetY = (h - renderH) / 2;
                } else {
                    renderH = h; renderW = h * vRatio;
                    offsetX = (w - renderW) / 2; offsetY = 0;
                }
            }
        }

        function initOpenCV() {
            src = new cv.Mat();
            small = new cv.Mat();
            gray = new cv.Mat();
            blur = new cv.Mat();
            edge = new cv.Mat();
            hsv = new cv.Mat();
            sat = new cv.Mat();
            planes = new cv.MatVector();
            binary = new cv.Mat();
            contours = new cv.MatVector();
            hierarchy = new cv.Mat();
            approx = new cv.Mat();
        }

        function processVideo() {
            if (!streaming) return;

            try {
                let cap = new cv.VideoCapture(video);
                cap.read(src);

                // 1. 統一縮小到寬度 320px (為了同時跑 4 個演算法不卡頓)
                let scale = 320 / src.cols;
                cv.resize(src, small, new cv.Size(320, src.rows * scale));

                let resultScores = [0, 0, 0, 0];
                let bestPolys = [null, null, null, null];

                // ==========================================
                // 🧠 Pipeline 1: Classic Canny (邊緣)
                // ==========================================
                cv.cvtColor(small, gray, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
                cv.Canny(blur, edge, 30, 120); // 低閥值
                // 膨脹連接斷線
                let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
                cv.dilate(edge, edge, kernel);
                
                cv.imshow('c1', edge); // 顯示在視窗 1
                let res1 = analyzeContours(edge, scale); // 評分
                resultScores[0] = res1.score;
                bestPolys[0] = res1.poly;


                // ==========================================
                // 🧠 Pipeline 2: HSV Saturation (飽和度)
                // ==========================================
                cv.cvtColor(small, hsv, cv.COLOR_RGB2HSV);
                cv.split(hsv, planes);
                let sChannel = planes.get(1);
                // 木頭飽和度高，紙飽和度低。低於 60 算紙。
                cv.threshold(sChannel, sat, 60, 255, cv.THRESH_BINARY_INV);
                cv.dilate(sat, sat, kernel); // 連接
                
                cv.imshow('c2', sat); // 顯示在視窗 2
                let res2 = analyzeContours(sat, scale);
                resultScores[1] = res2.score;
                bestPolys[1] = res2.poly;
                sChannel.delete();


                // ==========================================
                // 🧠 Pipeline 3: Blur + Otsu (暴力亮度)
                // ==========================================
                // 重度模糊
                cv.GaussianBlur(gray, blur, new cv.Size(7, 7), 0);
                // Otsu 自動二值化
                cv.threshold(blur, binary, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
                // 形態學清理
                cv.morphologyEx(binary, binary, cv.MORPH_OPEN, kernel);
                cv.morphologyEx(binary, binary, cv.MORPH_CLOSE, kernel);
                
                cv.imshow('c3', binary); // 顯示在視窗 3
                let res3 = analyzeContours(binary, scale);
                resultScores[2] = res3.score;
                bestPolys[2] = res3.poly;


                // ==========================================
                // 🧠 Pipeline 4: Adaptive Threshold (自適應)
                // ==========================================
                // 這種方法通常雜訊很多，但對陰影抵抗力強
                cv.adaptiveThreshold(gray, binary, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);
                // 因為雜點多，需要侵蝕再膨脹
                cv.erode(binary, binary, kernel);
                cv.dilate(binary, binary, kernel);
                
                cv.imshow('c4', binary); // 顯示在視窗 4
                let res4 = analyzeContours(binary, scale);
                resultScores[3] = res4.score;
                bestPolys[3] = res4.poly;


                // ==========================================
                // 🏆 決勝負：顯示最佳結果
                // ==========================================
                let maxScore = -1;
                let winnerIndex = -1;

                // 更新分數 UI
                for(let i=0; i<4; i++) {
                    scores[i].innerText = "Score: " + Math.round(resultScores[i]);
                    boxes[i].classList.remove("winner");
                    if (resultScores[i] > maxScore) {
                        maxScore = resultScores[i];
                        winnerIndex = i;
                    }
                }

                // 繪製主畫面 Overlay
                ctxOverlay.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
                
                if (winnerIndex !== -1 && maxScore > 50) { // 至少要有點分數
                    boxes[winnerIndex].classList.add("winner"); // 亮起贏家視窗
                    let winnerPoly = bestPolys[winnerIndex];
                    if (winnerPoly) {
                        drawMainOverlay(winnerPoly);
                        document.getElementById("status").innerText = `最佳策略: ${getAlgoName(winnerIndex)} (分: ${Math.round(maxScore)})`;
                    }
                } else {
                    document.getElementById("status").innerText = "分析中... 無法鎖定目標";
                }
                
                kernel.delete();

                requestAnimationFrame(processVideo);

            } catch (err) {
                console.error(err);
            }
        }

        // === 評分邏輯 ===
        function analyzeContours(matInput, scale) {
            cv.findContours(matInput, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            
            let maxArea = 0;
            let bestScore = 0;
            let bestPolyPoints = null;
            let totalArea = matInput.rows * matInput.cols;

            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                
                // 1. 面積過濾 (太小不要，太大佔滿全螢幕也不要)
                if (area < totalArea * 0.1 || area > totalArea * 0.95) continue;

                let peri = cv.arcLength(cnt, true);
                cv.approxPolyDP(cnt, approx, 0.04 * peri, true);

                // 2. 形狀評分
                let score = 0;
                
                // 是四邊形？
                if (approx.rows === 4) {
                    score += 100;
                    // 是凸多邊形？
                    if (cv.isContourConvex(approx)) score += 50;
                    
                    // 面積越大越好 (加權)
                    score += (area / totalArea) * 100;

                    if (score > bestScore) {
                        bestScore = score;
                        // 儲存正規化座標
                        bestPolyPoints = [];
                        for(let j=0; j<8; j+=2) {
                            bestPolyPoints.push({
                                x: approx.data32S[j] / matInput.cols, // 0~1
                                y: approx.data32S[j+1] / matInput.rows // 0~1
                            });
                        }
                    }
                }
            }
            return { score: bestScore, poly: bestPolyPoints };
        }

        function drawMainOverlay(normPoints) {
            ctxOverlay.beginPath();
            ctxOverlay.lineWidth = 5;
            ctxOverlay.strokeStyle = "#0f0";
            
            let p0 = mapToScreen(normPoints[0]);
            ctxOverlay.moveTo(p0.x, p0.y);
            for(let i=1; i<4; i++) {
                let p = mapToScreen(normPoints[i]);
                ctxOverlay.lineTo(p.x, p.y);
            }
            ctxOverlay.closePath();
            ctxOverlay.stroke();
        }

        function mapToScreen(np) {
            return {
                x: np.x * video.videoWidth / video.videoWidth * renderW + offsetX,
                y: np.y * video.videoHeight / video.videoHeight * renderH + offsetY
            };
        }

        function getAlgoName(i) {
            return ["Canny", "HSV", "Blur+Otsu", "Adaptive"][i];
        }

    </script>
</body>
</html>
